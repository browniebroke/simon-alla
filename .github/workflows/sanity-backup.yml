name: Sanity backup

# Monthly export of the Sanity dataset (documents and images), stored as a
# GitHub release asset. Needs a read-only Sanity token in the
# SANITY_AUTH_TOKEN repository secret.

on:
  schedule:
    - cron: '0 3 1 * *' # 03:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write # to create the release

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --workspace studio

      - name: Export dataset
        working-directory: studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity datasets export production "$RUNNER_TEMP/sanity-production.tar.gz" --overwrite

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="backup-$(date -u +%Y-%m-%d)"
          gh release create "$tag" "$RUNNER_TEMP/sanity-production.tar.gz" \
            --title "Sanity backup $(date -u +%Y-%m-%d)" \
            --notes "Export of the production dataset. Restore with: npx sanity datasets import sanity-production.tar.gz production --replace" \
            --latest=false
